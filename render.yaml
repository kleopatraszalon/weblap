# render.yaml (Blueprint)
# Render Static Site esetén a 301 redirecteket itt kell kezelni; .htaccess nem fut.

services:
  - type: web
    name: kleoszalon-weblap
    env: static
    staticPublishPath: dist
    buildCommand: npm ci && npm run build
    headers:
      - path: /franchise-v1
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet
      - path: /franchise-info
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet
      - path: /franchise-koszonjuk
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet
    routes:
      # Render `type: redirect` szabályai 301 Moved Permanently válasszal működnek.
      # --- Angol/technikai aliasok -> magyar kanonikus URL-ek ---
      - type: redirect
        source: /services
        destination: /szolgaltatasok
      - type: redirect
        source: /services/*
        destination: /szolgaltatasok/*

      # --- Régi fő szolgáltatásoldalak ---
      - type: redirect
        source: /kozmetika
        destination: /szolgaltatasok/kozmetika
      - type: redirect
        source: /fodraszat
        destination: /szolgaltatasok/fodraszat
      - type: redirect
        source: /masszazs
        destination: /szolgaltatasok/masszazs
      - type: redirect
        source: /koromapolas
        destination: /szolgaltatasok/kez-es-labapolas
      - type: redirect
        source: /eskuvo
        destination: /szolgaltatasok/eskuvo

      # --- Régi kozmetikai szolgáltatás URL-ek ---
