name: Booking 4 recommendation conversion
on:
  push:
    branches: [feature/booking-4-growth]
    paths: [.github/workflows/booking-v4-reco-click.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-4-growth
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/BookingPageV5.tsx');s=p.read_text()
          old='<button className="btn alt" onClick={()=>add(String(r.service_id||r.id))}>Hozzáad</button>'
          new='<button className="btn alt" onClick={()=>{trackBooking("recommendation_clicked",{location_id:locationId,service_ids:serviceIds,recommendation_id:r.id,metadata:{recommended_service_id:r.service_id||r.id}});add(String(r.service_id||r.id))}}>Hozzáad</button>'
          if old in s:s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: grep -q 'recommendation_clicked' src/pages/BookingPageV5.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/pages/BookingPageV5.tsx
          git diff --cached --quiet || (git commit -m "feat(booking-v4): attribute recommendation clicks" && git push origin HEAD:feature/booking-4-growth)
# trigger
