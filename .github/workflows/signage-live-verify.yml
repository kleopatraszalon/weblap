name: Signage live Render verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: signage-live-render-main
  cancel-in-progress: true

jobs:
  verify-live-signage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://weblap-o3g6.onrender.com
    steps:
      - name: Mark signage verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Waiting for smart signage bundle on Render",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Wait for Render and verify deployed smart signage bundle
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 72); do
            marker="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/signage-build.txt?_=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            html="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/signage/?_=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            asset="$(printf '%s' "$html" | grep -oE 'src="/assets/[^\"]+\.js"' | head -1 | cut -d'"' -f2 || true)"
            if [[ "$marker" == *"smart-signage-v3"* && "$marker" == *"source-merge=1ed3bfdcc5bcfc410092847fd5c9d5dc6f7e5a64"* && -n "$asset" ]]; then
              curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL${asset}?_=${GITHUB_SHA}-${attempt}" -o /tmp/signage-live.js || true
              if grep -q 'SMART SIGNAGE' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'MOST FELSZABADULT IDŐPONT' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'KLEOSHOP' /tmp/signage-live.js 2>/dev/null \
                && grep -q '/api/signage/birthdays' /tmp/signage-live.js 2>/dev/null \
                && grep -q '/api/public/booking/v4/last-minute' /tmp/signage-live.js 2>/dev/null; then
                echo "Smart signage v3 is live. asset=$asset"
                ok=1
                break
              fi
            fi
            echo "Waiting for Render smart signage deployment ($attempt/72)"
            sleep 10
          done
          test "$ok" -eq 1 || { echo "Smart signage v3 was not observable on Render within the verification window." >&2; exit 1; }

      - name: Mark signage live verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"success",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Smart signage v3 verified live on Render",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Mark signage live verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"failure",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Smart signage v3 not verified live on Render",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
