name: Signage live Render verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: signage-live-render-main
  cancel-in-progress: true

jobs:
  verify-live-signage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SITE_URL: https://weblap-o3g6.onrender.com
    steps:
      - name: Mark signage verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Waiting for Smart Signage v18 native UI",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Wait for Render and verify deployed Smart Signage v18
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 90); do
            marker="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/signage-build.txt?_=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            html="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/signage/?_=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            js_asset="$(printf '%s' "$html" | grep -oE 'src="/assets/[^\"]+\.js"' | head -1 | cut -d'"' -f2 || true)"
            css_asset="$(printf '%s' "$html" | grep -oE 'href="/assets/[^\"]+\.css"' | head -1 | cut -d'"' -f2 || true)"

            if [[ "$marker" == *"smart-signage-v18"* \
              && "$marker" == *"ui=native-signage-dom"* \
              && "$marker" == *"prices=rolling-public-pricelist-v4"* \
              && "$marker" == *"cards=exactly-five-native-cards"* \
              && "$marker" == *"anchor=existing-sgx-widgetDock-v3-upper-content-band"* \
              && -n "$js_asset" \
              && -n "$css_asset" ]]; then
              curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL${js_asset}?_=${GITHUB_SHA}-${attempt}" -o /tmp/signage-live.js || true
              curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL${css_asset}?_=${GITHUB_SHA}-${attempt}" -o /tmp/signage-live.css || true

              if grep -q '__kleoSignageNativeV18Installed' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'native-five-cards-v18' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'rolling-public-pricelist-v18' /tmp/signage-live.js 2>/dev/null \
                && grep -q '/api/public/booking/v4/pricelist' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'ÁRAINK' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'NÉVNAPI KEDVEZMÉNY' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'NAPI MOTIVÁCIÓ' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'SZÉPSÉG · ÓRÁNKÉNT ÚJ' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'GYM GYAKORLAT TIPP' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'sgx-widgetDock-v18' /tmp/signage-live.css 2>/dev/null \
                && grep -q 'sgx-widget-nameday-v18' /tmp/signage-live.css 2>/dev/null \
                && grep -q 'sgx-widget-weather-v18' /tmp/signage-live.css 2>/dev/null \
                && grep -q 'sgx-widget-motivation-v18' /tmp/signage-live.css 2>/dev/null \
                && grep -q 'sgx-widget-beauty-v18' /tmp/signage-live.css 2>/dev/null \
                && grep -q 'sgx-widget-gym-v18' /tmp/signage-live.css 2>/dev/null \
                && grep -q 'sgPriceNativeRollV18' /tmp/signage-live.css 2>/dev/null \
                && ! grep -q 'react-five-cards-v17' /tmp/signage-live.js 2>/dev/null; then
                echo "Smart Signage v18 native price list + five cards are live. js=$js_asset css=$css_asset"
                ok=1
                break
              fi
            fi
            echo "Waiting for Render Smart Signage v18 deployment ($attempt/90)"
            sleep 10
          done
          test "$ok" -eq 1 || { echo "Smart Signage v18 was not observable on Render within the verification window." >&2; exit 1; }

      - name: Mark signage live verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"success",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Smart Signage v18 native UI verified live",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Mark signage live verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"failure",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Smart Signage v18 not verified live",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
