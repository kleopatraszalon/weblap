name: Signage live Render verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: signage-live-render-main
  cancel-in-progress: true

jobs:
  verify-live-signage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SITE_URL: https://weblap-o3g6.onrender.com
      API_URL: https://kleoszalon-api-1.onrender.com
    steps:
      - name: Mark pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Waiting for Smart Signage v23",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Verify v23 live bundle
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 90); do
            marker="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/signage-build.txt?_=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            html="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/signage/?_=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            js_asset="$(printf '%s' "$html" | grep -oE 'src="/assets/[^\"]+\.js"' | head -1 | cut -d'"' -f2 || true)"
            if [[ "$marker" == *"smart-signage-v23"* && "$marker" == *"anchor=full-signage-viewport"* && "$marker" == *"text-repeat=none"* && "$marker" == *"prices=booking-v4-only-native-panel-rolling"* && -n "$js_asset" ]]; then
              curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL${js_asset}?_=${GITHUB_SHA}-${attempt}" -o /tmp/signage.js || true
              if grep -q '__kleoSignageNativeV23Installed' /tmp/signage.js && grep -q 'v23-full-frame-readable-cards' /tmp/signage.js && grep -q 'kleoV23PriceTrack' /tmp/signage.js && grep -q '/api/public/booking/v4/pricelist' /tmp/signage.js && ! grep -q '__kleoSignageNativeV22Installed' /tmp/signage.js; then
                ok=1; break
              fi
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Verify Booking 4.0 priced rows
        run: |
          curl -fsS --max-time 45 "$API_URL/api/public/booking/v4/pricelist?_=${GITHUB_SHA}" -o /tmp/booking4.json
          node - /tmp/booking4.json <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); const a=Array.isArray(d)?d:(d.services||d.items||d.rows||[]);
          const n=v=>{const x=Number(String(v??'').replace(/\s/g,'').replace(/[^0-9,.-]/g,'').replace(',','.'));return Number.isFinite(x)?x:0};
          const ok=a.some(x=>[x?.price,x?.base_price,x?.price_text,x?.priceText,x?.level_prices?.normal,x?.level_prices?.top,x?.level_prices?.master].some(v=>n(v)>0));
          if(!ok) process.exit(1);
          NODE

      - name: Mark success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"success",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Smart Signage v23 live",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Mark failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"failure",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Smart Signage v23 not verified",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
