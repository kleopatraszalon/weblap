name: Signage live Render verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: signage-live-render-main
  cancel-in-progress: true

jobs:
  verify-live-signage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SITE_URL: https://weblap-o3g6.onrender.com
      API_URL: https://kleoszalon-api-1.onrender.com
    steps:
      - name: Mark signage verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Waiting for Smart Signage v21 full-frame UI",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Wait for Render and verify deployed Smart Signage v21
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 90); do
            marker="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/signage-build.txt?_=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            html="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/signage/?_=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            js_asset="$(printf '%s' "$html" | grep -oE 'src="/assets/[^\"]+\.js"' | head -1 | cut -d'"' -f2 || true)"
            css_asset="$(printf '%s' "$html" | grep -oE 'href="/assets/[^\"]+\.css"' | head -1 | cut -d'"' -f2 || true)"

            if [[ "$marker" == *"smart-signage-v21"* \
              && "$marker" == *"cards=exactly-five-compact-full-frame-bouncing-single-copy-cards"* \
              && "$marker" == *"anchor=full-signage-frame"* \
              && "$marker" == *"prices=booking-v4-only-rolling-pricelist"* \
              && "$marker" == *"motion=request-animation-frame-bouncing-collision-aware"* \
              && -n "$js_asset" && -n "$css_asset" ]]; then
              curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL${js_asset}?_=${GITHUB_SHA}-${attempt}" -o /tmp/signage-live.js || true
              curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL${css_asset}?_=${GITHUB_SHA}-${attempt}" -o /tmp/signage-live.css || true
              if grep -q '__kleoSignageNativeV21Installed' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'full-frame-five-moving-cards-v21' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'booking4-rolling-price-overlay-v21' /tmp/signage-live.js 2>/dev/null \
                && grep -q '/api/public/booking/v4/pricelist' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'requestAnimationFrame' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'kleoRoamLayerV21' /tmp/signage-live.css 2>/dev/null \
                && grep -q 'kleoV21SingleMarquee' /tmp/signage-live.css 2>/dev/null \
                && grep -q 'kleoPriceOverlayV21' /tmp/signage-live.css 2>/dev/null \
                && grep -q '#df1f7c' /tmp/signage-live.css 2>/dev/null \
                && grep -q '#1691d1' /tmp/signage-live.css 2>/dev/null \
                && grep -q '#ef961c' /tmp/signage-live.css 2>/dev/null \
                && grep -q '#a94fd1' /tmp/signage-live.css 2>/dev/null \
                && grep -q '#24af79' /tmp/signage-live.css 2>/dev/null \
                && ! grep -q '__kleoSignageNativeV20Installed' /tmp/signage-live.js 2>/dev/null; then
                echo "Smart Signage v21 full-frame cards are live. js=$js_asset css=$css_asset"
                ok=1
                break
              fi
            fi
            echo "Waiting for Render Smart Signage v21 deployment ($attempt/90)"
            sleep 10
          done
          test "$ok" -eq 1 || { echo "Smart Signage v21 was not observable on Render within the verification window." >&2; exit 1; }

      - name: Verify Booking 4.0 returns real prices
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 -H 'Accept: application/json' -H 'Cache-Control: no-cache' "$API_URL/api/public/booking/v4/pricelist?_=${GITHUB_SHA}" -o /tmp/booking4.json
          node - /tmp/booking4.json <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const arr = Array.isArray(data) ? data : (data.services || data.items || []);
          const numeric = (v) => {
            if (v == null) return 0;
            const n = Number(String(v).replace(/\s/g,'').replace(/[^0-9,.-]/g,'').replace(',','.'));
            return Number.isFinite(n) ? n : 0;
          };
          const priced = Array.isArray(arr) ? arr.filter((x) => [x?.price,x?.base_price,x?.price_text,x?.priceText,x?.level_prices?.normal,x?.level_prices?.top,x?.level_prices?.master,x?.level_prices?.premium].some((v) => numeric(v) > 0)) : [];
          console.log(`Booking 4.0 priced rows: ${priced.length}`);
          if (!priced.length) process.exit(1);
          NODE

      - name: Mark signage live verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"success",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Smart Signage v21 + Booking 4.0 prices live",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Mark signage live verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"failure",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Smart Signage v21 not fully verified live",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
