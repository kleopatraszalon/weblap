name: Signage live Render verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: signage-live-render-main
  cancel-in-progress: true

jobs:
  verify-live-signage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SITE_URL: https://weblap-o3g6.onrender.com
    steps:
      - name: Mark signage verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Waiting for Smart Signage v9 + Kleo line mascot on Render",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Wait for Render and verify deployed Smart Signage v9
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 90); do
            marker="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/signage-build.txt?_=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            html="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/signage/?_=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            js_asset="$(printf '%s' "$html" | grep -oE 'src="/assets/[^\"]+\.js"' | head -1 | cut -d'"' -f2 || true)"
            css_asset="$(printf '%s' "$html" | grep -oE 'href="/assets/[^\"]+\.css"' | head -1 | cut -d'"' -f2 || true)"

            if [[ "$marker" == *"smart-signage-v9"* \
              && "$marker" == *"motion=raf-inline-important-continuous"* \
              && "$marker" == *"youtube=curated-random-gym-hair-beauty"* \
              && "$marker" == *"mascot=kleo-line-v1"* \
              && -n "$js_asset" \
              && -n "$css_asset" ]]; then
              curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL${js_asset}?_=${GITHUB_SHA}-${attempt}" -o /tmp/signage-live.js || true
              curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL${css_asset}?_=${GITHUB_SHA}-${attempt}" -o /tmp/signage-live.css || true

              if grep -q '__kleoSignageMotionV9Installed' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'raf-v9' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'requestAnimationFrame' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'translate3d' /tmp/signage-live.js 2>/dev/null \
                && grep -q '__kleoSignageMotionV8Installed' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'kleoLineMascotLayer' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'UItWltVZZmE' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'SM-OspCx4qk' /tmp/signage-live.js 2>/dev/null \
                && grep -q 'y7UyKEb2ZHw' /tmp/signage-live.js 2>/dev/null; then
                echo "Smart Signage v9 RAF motion + Kleo line mascot + random YouTube bundle are live. js=$js_asset css=$css_asset"
                ok=1
                break
              fi
            fi
            echo "Waiting for Render Smart Signage v9 + Kleo line mascot deployment ($attempt/90)"
            sleep 10
          done
          test "$ok" -eq 1 || { echo "Smart Signage v9 + Kleo line mascot was not observable on Render within the verification window." >&2; exit 1; }

      - name: Mark signage live verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"success",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Smart Signage v9 + Kleo line mascot verified live on Render",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Mark signage live verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"failure",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Smart Signage v9 + Kleo line mascot not verified live on Render",context:"signage/live-render"}))')"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
