name: Booking V5 route patch
on:
  push:
    branches: [feature/booking-4-chain-ui]
    paths: [.github/workflows/booking-v5-route-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-4-chain-ui
      - name: Switch public booking routes to V5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          s=s.replace('import { BookingPageV4 } from "./pages/BookingPageV4";','import { BookingPageV5 } from "./pages/BookingPageV5";')
          s=s.replace('<BookingPageV4 />','<BookingPageV5 />')
          p.write_text(s)
          PY
      - run: |
          grep -q 'BookingPageV5' src/App.tsx
          ! grep -q '<BookingPageV4' src/App.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.tsx
          git diff --cached --quiet || (git commit -m "feat(booking-v4): route public booking to multi-specialist UI" && git push origin HEAD:feature/booking-4-chain-ui)
